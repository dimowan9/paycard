{% extends "base.html" %}
{% block content %}
<div class="wrap" style="text-align:center;padding:120px 0">
  <h1 style="font-size:64px" class="grad">{{ code }}</h1>
  <p style="color:var(--muted);margin:10px 0 28px">{{ msg if code == 400 else '页面不存在' }}</p>
  <a href="{{ url_for('index') }}" class="btn btn-ghost">返回首页</a>
</div>
{% endblock %}
