{% extends "base.html" %}
{% block title %}修改密码{% endblock %}
{% block content %}
<h1>🔑 修改管理员密码</h1>
<div class="card" style="max-width:420px">
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <p style="margin-bottom:6px;color:#6b7290">原密码</p><input type="password" name="old" required style="width:100%;margin-bottom:12px">
    <p style="margin-bottom:6px;color:#6b7290">新密码（至少 6 位）</p><input type="password" name="new" required minlength="6" style="width:100%;margin-bottom:12px">
    <p style="margin-bottom:6px;color:#6b7290">确认新密码</p><input type="password" name="new2" required minlength="6" style="width:100%;margin-bottom:16px">
    <button class="btn btn-pri">保存</button>
  </form>
</div>
{% endblock %}
