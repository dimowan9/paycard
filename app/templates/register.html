{% extends "base.html" %}
{% block title %}注册 · {{ cfg.SITE_NAME }}{% endblock %}
{% block content %}
<div class="wrap">
  <form class="auth" method="post" autocomplete="on">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <h1>注册账号</h1>
    <p class="sub">使用邮箱和自定义密码注册 · 每个 IP 仅限注册一个账号</p>
    <div class="field"><label>邮箱</label><input type="email" name="email" value="{{ form.email }}" required maxlength="191" placeholder="you@example.com" autocomplete="email"></div>
    <div class="field"><label>密码（6-64 位）</label><input type="password" name="password" required minlength="6" maxlength="64" autocomplete="new-password"></div>
    <div class="field"><label>确认密码</label><input type="password" name="password2" required minlength="6" maxlength="64" autocomplete="new-password"></div>
    <button class="btn btn-pri">注册</button>
    <p class="alt-link">已有账号？<a href="{{ url_for('login') }}">去登录</a></p>
  </form>
</div>
{% endblock %}
